<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViBE Pieces — Discover Your Vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ====================================================
     DESIGN TOKENS
  ==================================================== */
  :root{
    --ice-blue:      #dbe6ee;
    --ice-blue-soft: #e8f0f5;
    --charcoal:       #16181c;
    --taupe:          #8c8377;
    --taupe-deep:     #6f675d;
    --white:          #ffffff;
    --off-white:      #f6f4f0;
    --ink:            #1c1c1c;
    --line:           #d9d9d9;
    --badge-navy:     #1f2a44;
    --error:          #b3392c;
    --success:        #3c6e4f;

    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --container: 1200px;
    --gap-lg: clamp(3rem, 6vw, 7rem);
    --gap-md: clamp(1.5rem, 3vw, 3rem);
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  h1,h2,h3,h4{ font-family: var(--font-serif); margin:0; font-weight:500; }
  .container{ max-width: var(--container); margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 3rem); }

  :focus-visible{ outline: 2px solid var(--badge-navy); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ANNOUNCEMENT BAR */
  .announcement{
    background: var(--ice-blue);
    color: var(--ink);
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    padding: 0.65rem 1rem;
    font-weight: 500;
  }

  /* HEADER */
  .site-header{
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--white);
    border-bottom: 1px solid var(--line);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 1.1rem clamp(1.25rem, 4vw, 3rem);
  }
  .header-side{
    display:flex;
    align-items:center;
    gap: 1.25rem;
    flex: 1;
  }
  .header-side.right{ justify-content:flex-end; }
  .icon-btn{
    background:none;
    border:none;
    padding: 0.25rem;
    display:flex;
    align-items:center;
    color: var(--ink);
  }
  .icon-btn svg{ width:20px; height:20px; }
  .logo{
    font-family: var(--font-serif);
    font-size: 1.5rem;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .cart-wrap{ position: relative; }
  .cart-badge{
    position:absolute;
    top:-6px;
    right:-8px;
    background: var(--badge-navy);
    color: var(--white);
    font-size: 0.62rem;
    font-weight:600;
    width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .account-name-pill{
    font-size:0.68rem;
    font-weight:600;
    color: var(--taupe-deep);
    margin-right: -0.4rem;
    white-space: nowrap;
  }

  /* Search bar dropdown */
  .search-bar{
    max-height:0;
    overflow:hidden;
    background: var(--off-white);
    border-bottom: 1px solid transparent;
    transition: max-height 0.35s ease, border-color 0.35s ease;
  }
  .search-bar.active{
    max-height: 90px;
    border-bottom-color: var(--line);
  }
  .search-bar-inner{
    max-width: var(--container);
    margin: 0 auto;
    padding: 1rem clamp(1.25rem, 4vw, 3rem);
    display:flex;
    align-items:center;
    gap: 0.75rem;
  }
  .search-bar-inner input{
    flex:1;
    border:none;
    background:none;
    border-bottom: 1px solid var(--ink);
    font-family: var(--font-sans);
    font-size: 1rem;
    padding: 0.4rem 0.1rem;
  }
  .search-bar-inner input:focus{ outline:none; }
  .search-bar-inner .icon-btn svg{ width:18px; height:18px; }
  .search-results-count{
    font-size: 0.72rem;
    color: var(--taupe-deep);
    white-space:nowrap;
  }

  /* DRAWER MENU */
  .overlay{
    position: fixed;
    inset:0;
    background: rgba(20,22,26,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease;
    z-index: 300;
  }
  .overlay.active{ opacity:1; pointer-events:auto; }

  .drawer{
    position: fixed;
    top:0; left:0;
    height:100%;
    width: min(340px, 84vw);
    background: var(--ice-blue-soft);
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(.4,0,.2,1);
    z-index: 400;
    padding: 2rem clamp(1.5rem, 5vw, 2.5rem);
    overflow-y:auto;
  }
  .drawer.active{ transform: translateX(0); }
  .drawer-close{
    background:none;
    border:none;
    padding:0.5rem;
    margin-left:-0.5rem;
    margin-bottom: 2.5rem;
  }
  .drawer-close svg{ width:22px; height:22px; }
  .drawer-nav{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap: 1.6rem;
  }
  .drawer-nav a{
    font-family: var(--font-sans);
    font-size: 1.05rem;
    font-weight:400;
    letter-spacing: 0.01em;
    color: var(--ink);
    transition: opacity 0.2s ease, padding-left 0.2s ease;
    display:inline-block;
  }
  .drawer-nav a:hover{ opacity:0.55; padding-left: 4px; }

  /* HERO */
  .hero{
    position: relative;
    overflow: hidden;
    min-height: 90vh;
    display:flex;
    align-items:flex-end;
    background-color: #8B857B;
  }
  .hero-bg-img{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .hero-overlay{ display: none; }
  .hero-content{
    position: relative;
    z-index: 3;
    padding: 0 clamp(1.5rem, 6vw, 5rem) clamp(3.5rem, 9vw, 7rem);
    max-width: 640px;
    color: var(--white);
  }
  .hero-content h1{
    font-family: var(--font-serif);
    font-size: clamp(2.6rem, 5.6vw, 4.4rem);
    font-weight: 500;
    line-height: 1.12;
    letter-spacing: 0.01em;
    color: var(--white);
    margin-bottom: 1.2rem;
    text-shadow: 0 2px 14px rgba(0,0,0,0.28);
  }
  .hero-content p{
    font-size: clamp(1rem, 1.3vw, 1.1rem);
    line-height: 1.45;
    font-weight:400;
    max-width: 460px;
    margin: 0 0 2.4rem;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 8px rgba(0,0,0,0.22);
  }
  .hero-btn{
    background: var(--white);
    color: var(--ink);
    border-color: var(--white);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-transform: none;
    padding: 1rem 2.5rem;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
  }
  .hero-btn:hover{
    background: transparent;
    color: var(--white);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  @media (max-width: 480px){
    .hero-content{ padding: 0 1.25rem 2.5rem; }
  }
  .btn{
    display:inline-block;
    background: var(--ice-blue);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight:600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1rem 2.1rem;
    border: 1px solid var(--ice-blue);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .btn:hover{ background: transparent; color: var(--white); }
  .btn-outline{
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
  }
  .btn-outline:hover{ background: var(--ink); color: var(--white); }
  .btn-block{ width:100%; text-align:center; }
  .btn-small{
    padding: 0.7rem 1.4rem;
    font-size: 0.72rem;
  }

  /* SHOP SECTION */
  .section{ padding: var(--gap-lg) 0; }
  .section-title{
    font-size: clamp(2rem, 4vw, 2.9rem);
    text-align:center;
    margin-bottom: var(--gap-md);
  }
  .product-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.5rem;
  }
  .more-products{
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.8s cubic-bezier(.4,0,.2,1), opacity 0.6s ease, margin-top 0.4s ease;
  }
  .more-products.expanded{
    max-height: 6000px;
    opacity: 1;
    margin-top: 1.5rem;
  }
  .show-more-wrap{
    display:flex;
    justify-content:center;
    margin-top: 2rem;
  }
  .show-more-wrap.is-hidden{ display:none; }

  /* PRODUCTS DISPLAY */
  .product-card{
    box-sizing: border-box;
    max-width: 100%;
    border: 1px solid #eeeeee;
    background: #ffffff;
    display:flex;
    flex-direction:column;
    overflow: hidden;
    transition: box-shadow 0.25s ease;
  }
  .product-card:hover{ box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  .product-card.is-hidden{ display:none; }

  .product-media{ display:block; position: relative; }
  .product-slider{
    position: relative;
    overflow: hidden;
    background-color: #f9f9f9;
    touch-action: pan-y;
  }
  .slider-track{
    display:flex;
    transition: transform 0.35s ease;
    will-change: transform;
  }
  .slider-track img{
    width:100%;
    flex: 0 0 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background-color: #f9f9f9;
    display:block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .slider-arrow{
    position:absolute;
    top:50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border:none;
    background: rgba(255,255,255,0.85);
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
    line-height:1;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease;
    z-index: 2;
  }
  .slider-arrow:hover{ background: var(--white); }
  .slider-arrow.prev{ left: 8px; }
  .slider-arrow.next{ right: 8px; }
  .product-slider:hover .slider-arrow{ opacity: 1; }
  @media (hover:none){ .slider-arrow{ opacity: 1; } }
  .slider-dots{
    position:absolute;
    left:0; right:0;
    bottom: 8px;
    display:flex;
    justify-content:center;
    gap: 5px;
    z-index: 2;
  }
  .slider-dot{
    width:6px; height:6px;
    border-radius:50%;
    border:none;
    background: rgba(255,255,255,0.6);
    padding:0;
  }
  .slider-dot.active{ background: var(--white); }
  .product-title-link{ display:block; }
  .product-title-link h4{ transition: opacity 0.2s ease; }
  .product-title-link:hover h4{ opacity: 0.7; }

  .product-info{ padding: 0.65rem 0.7rem 0.8rem; display:flex; flex-direction:column; gap: 0.4rem; }
  .product-info h4{
    font-size: 0.82rem;
    font-weight:500;
    line-height:1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-price{ font-family: var(--font-sans); font-weight:600; font-size: 0.78rem; color: var(--taupe-deep); margin:0; }
  .qty-selector{
    display:flex;
    align-items:center;
    border: 1px solid var(--line);
    width: fit-content;
  }
  .qty-btn{
    background:none; border:none;
    width: 24px; height: 24px;
    font-size: 0.85rem;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink);
  }
  .qty-btn:hover{ background: var(--off-white); }
  .qty-input{
    width: 28px;
    text-align:center;
    border:none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    font-family: var(--font-sans);
    font-size: 0.78rem;
    padding: 0;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .add-to-cart-btn{
    background: var(--ink);
    color: var(--white);
    border: none;
    padding: 0.5rem 0.6rem;
    font-size: 0.66rem;
    font-weight:600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    transition: background 0.2s ease;
  }
  .add-to-cart-btn:hover{ background: var(--taupe-deep); }
  .add-to-cart-btn.added{ background: var(--success); }
  .empty-note{
    color: var(--taupe-deep);
    font-size: 0.85rem;
    font-style: italic;
    padding: 1rem 0;
  }

  /* STATEMENTS */
  .statement-1{
    position: relative;
    overflow: hidden;
    background-color: var(--taupe);
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .banner-bg-img{
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  .banner-overlay{ display: none; }
  .statement-1 h2{
    position:relative; z-index:3;
    font-family: var(--font-serif); color: var(--white);
    font-size: clamp(1.9rem, 3.6vw, 2.9rem); font-weight: 500;
    line-height: 1.45; letter-spacing: 0.01em; max-width: 740px;
    padding: 0 clamp(1.5rem, 6vw, 3rem); text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  @media (max-width: 480px){ .statement-1{ min-height: 48vh; } }

  .statement-2{ max-width: 640px; }
  .overline{
    display:block; font-size: 0.75rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--taupe-deep); margin-bottom: 1.1rem; font-weight:500;
  }
  .statement-2 h2{
    font-size: clamp(1.9rem, 4vw, 2.9rem); line-height: 1.25;
    color: var(--ink); margin-bottom: 1.5rem;
  }
  .learn-more{
    display:inline-flex; align-items:center; gap: 0.5rem;
    font-size: 0.9rem; font-weight:500; border-bottom: 1px solid var(--ink);
    padding-bottom: 2px; transition: gap 0.25s ease;
  }
  .learn-more:hover{ gap: 0.85rem; }

  /* TESTIMONIAL */
  .testimonial{
    background: var(--ice-blue); text-align:center;
    padding: var(--gap-lg) clamp(1.25rem, 5vw, 3rem);
  }
  .testimonial blockquote{
    font-family: var(--font-serif); font-style: italic;
    font-size: clamp(1.4rem, 3vw, 2.1rem); line-height: 1.5;
    max-width: 760px; margin: 0 auto 1.5rem; color: var(--ink);
  }
  .testimonial cite{
    display:block; font-style:normal; font-family: var(--font-serif);
    font-size: 1.1rem; margin-bottom: 2.2rem; color: var(--taupe-deep);
  }

  /* FOOTER */
  .site-footer{
    background: var(--charcoal); color: var(--off-white);
    padding: var(--gap-lg) 0 2rem;
  }
  .footer-top{ max-width: 560px; margin-bottom: var(--gap-md); }
  .footer-top h2{ color: var(--white); font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 0.9rem; }
  .footer-top p{ font-weight:300; color: rgba(246,244,240,0.75); margin: 0 0 2.2rem; font-size: 1rem; }
  .newsletter-form{
    display:flex; align-items:flex-end; gap: 1.5rem; max-width: 460px;
    border-bottom: 1px solid rgba(255,255,255,0.4); padding-bottom: 0.75rem;
  }
  .newsletter-form input{
    flex:1; background:none; border:none; color: var(--white);
    font-family: var(--font-sans); font-size: 1rem; padding: 0.4rem 0;
  }
  .newsletter-form input::placeholder{ color: rgba(255,255,255,0.5); }
  .newsletter-form input:focus{ outline:none; }
  .signup-link{
    background:none; border:none; color: var(--white);
    font-size: 0.9rem; font-weight:600; letter-spacing: 0.03em;
    white-space:nowrap; padding-bottom: 0.4rem;
  }
  .footer-meta{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap: 1rem; border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 2rem; font-size: 0.78rem; color: rgba(246,244,240,0.55);
  }
  .footer-meta a{ text-decoration: underline; text-underline-offset: 3px; }
  .footer-meta-links{ display:flex; gap: 1.25rem; align-items:center; }

  /* CART DRAWER */
  .cart-drawer{
    position: fixed; top:0; right:0; height:100%;
    width: min(420px, 92vw); background: var(--white);
    transform: translateX(100%); transition: transform 0.4s cubic-bezier(.4,0,.2,1);
    z-index: 400; display:flex; flex-direction:column;
  }
  .cart-drawer.active{ transform: translateX(0); }
  .cart-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 1.5rem clamp(1.25rem, 4vw, 2rem); border-bottom: 1px solid var(--line);
  }
  .cart-header h3{ font-size: 1.4rem; }
  .cart-close{ background:none; border:none; padding: 0.4rem; }
  .cart-close svg{ width:20px; height:20px; }
  .cart-items{ flex:1; overflow-y:auto; padding: 1rem clamp(1.25rem, 4vw, 2rem); }
  .cart-item{ display:flex; gap: 0.9rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .cart-item img{ width: 68px; height: 68px; object-fit:cover; background: var(--off-white); flex-shrink:0; }
  .cart-item-info{ flex:1; display:flex; flex-direction:column; gap: 0.35rem; }
  .cart-item-info h5{ font-family: var(--font-sans); font-size: 0.9rem; font-weight:500; margin:0; }
  .cart-item-meta{ display:flex; align-items:center; justify-content:space-between; font-size: 0.8rem; color: var(--taupe-deep); }
  .cart-item-qty{ display:flex; align-items:center; gap: 0.5rem; }
  .cart-item-qty button{
    background: var(--off-white); border: 1px solid var(--line);
    width: 22px; height: 22px; font-size: 0.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .cart-item-remove{ background:none; border:none; color: var(--error); font-size: 0.72rem; text-decoration: underline; align-self:flex-start; }
  .cart-empty{ text-align:center; color: var(--taupe-deep); padding: 3rem 1rem; font-style:italic; }
  .cart-footer{ border-top: 1px solid var(--line); padding: 1.25rem clamp(1.25rem, 4vw, 2rem) 1.75rem; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:baseline; font-size: 1.05rem; margin-bottom: 1.25rem; }
  .cart-total-row span:last-child{ font-weight:600; font-family: var(--font-serif); font-size: 1.3rem; }
  .checkout-form{ display:flex; flex-direction:column; gap: 0.75rem; }
  .checkout-form input{ width:100%; padding: 0.7rem 0.85rem; border: 1px solid var(--line); font-family: var(--font-sans); font-size: 0.88rem; }
  .checkout-form input:focus{ outline: 1px solid var(--ink); }
  .whatsapp-btn{
    background: #25D366; color: var(--white); border: none; padding: 0.95rem 1rem;
    font-size: 0.85rem; font-weight:600; letter-spacing: 0.03em; text-transform: uppercase;
    display:flex; align-items:center; justify-content:center; gap: 0.5rem;
  }
  .whatsapp-btn:hover{ background: #1ebc59; }

  /* MODALS */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(20,22,26,0.45);
    opacity:0; pointer-events:none; transition: opacity 0.3s ease;
    z-index: 500; display:flex; align-items:center; justify-content:center; padding: 1.5rem;
  }
  .modal-overlay.active{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--white); width: 100%; max-width: 380px;
    padding: 2.25rem 2rem; position:relative; transform: translateY(12px); transition: transform 0.3s ease;
  }
  .modal-overlay.active .modal{ transform: translateY(0); }
  .modal-close{ position:absolute; top:1rem; right:1rem; background:none; border:none; padding:0.3rem; }
  .modal-close svg{ width:18px; height:18px; }
  .modal h3{ font-size: 1.5rem; margin-bottom: 1.5rem; }
  .modal-form{ display:flex; flex-direction:column; gap: 0.9rem; }
  .modal-form input{ width:100%; padding: 0.75rem 0.9rem; border: 1px solid var(--line); font-family: var(--font-sans); font-size: 0.9rem; }
  .modal-form input:focus{ outline: 1px solid var(--ink); }
  .modal-switch{ font-size: 0.82rem; margin: 1.25rem 0 0; color: var(--taupe-deep); }
  .modal-switch a{ text-decoration:underline; color: var(--ink); }
  .modal-error{ color: var(--error); font-size: 0.78rem; display:none; }
